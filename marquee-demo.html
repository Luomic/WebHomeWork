<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡片无缝循环流动 · 效果预览</title>
    <style>
      :root {
        color-scheme: dark;
        --card-w: 250px;
        --gap: 48px;
        --sec-per-card: 7s;
        --fade: 14%;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 64px 0;
        background: Canvas;
        color: CanvasText;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }

      .title {
        margin: 0;
        font-size: 40px;
        letter-spacing: 0.08em;
      }

      .hint {
        margin: 0;
        font-size: 13px;
        opacity: 0.55;
      }

      /* ---------- 核心：无缝跑马灯 ---------- */

      .marquee {
        /* 每张卡通过屏幕所需时间 × 卡片数 = 一个完整周期 */
        --n: 6;
        --dur: calc(var(--n) * var(--sec-per-card));

        position: relative;
        width: 100%;
        overflow: hidden;

        /* 两端渐隐：mask 用不透明黑表示“保留”，透明表示“淡出” */
        -webkit-mask-image: linear-gradient(
          to right,
          transparent 0,
          #000 var(--fade),
          #000 calc(100% - var(--fade)),
          transparent 100%
        );
        mask-image: linear-gradient(
          to right,
          transparent 0,
          #000 var(--fade),
          #000 calc(100% - var(--fade)),
          transparent 100%
        );
      }

      .marquee__track {
        display: flex;
        width: max-content; /* 关键：不许收缩，否则 -50% 对不上 */
        animation: marquee var(--dur) linear infinite;
        will-change: transform;
      }

      /* -50% 恰好等于“一份列表”的宽度，所以首尾严丝合缝 */
      @keyframes marquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .marquee:hover .marquee__track {
        animation-play-state: paused;
      }

      /* 间距统一用 margin-right（含最后一张），这样 track 宽度正好是 2 个周期 */
      .card {
        flex: 0 0 var(--card-w);
        width: var(--card-w);
        margin-right: var(--gap);
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 10px;
        display: block;
        background: #1c1c1c;
      }

      .marquee--reverse .marquee__track {
        animation-direction: reverse;
      }

      @media (prefers-reduced-motion: reduce) {
        .marquee__track {
          animation: none;
        }
      }

      /* ---------- 调试面板 ---------- */

      .panel {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 13px;
        opacity: 0.8;
      }

      .panel label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .panel input[type='range'] {
        width: 160px;
      }
    </style>
  </head>
  <body>
    <p class="title">孤独市集</p>
    <p class="hint">缓慢向左流动 · 两端渐隐 · 悬停暂停</p>

    <div class="marquee" id="marquee">
      <div class="marquee__track">
        <img class="card" src="./public/placeholder/1.jpg" alt="" />
        <img class="card" src="./public/placeholder/2.jpg" alt="" />
        <img class="card" src="./public/placeholder/3.jpg" alt="" />
        <img class="card" src="./public/placeholder/4.jpg" alt="" />
        <img class="card" src="./public/placeholder/5.jpg" alt="" />
        <img class="card" src="./public/placeholder/6.jpg" alt="" />

        <img class="card" src="./public/placeholder/1.jpg" alt="" aria-hidden="true" />
        <img class="card" src="./public/placeholder/2.jpg" alt="" aria-hidden="true" />
        <img class="card" src="./public/placeholder/3.jpg" alt="" aria-hidden="true" />
        <img class="card" src="./public/placeholder/4.jpg" alt="" aria-hidden="true" />
        <img class="card" src="./public/placeholder/5.jpg" alt="" aria-hidden="true" />
        <img class="card" src="./public/placeholder/6.jpg" alt="" aria-hidden="true" />
      </div>
    </div>

    <div class="panel">
      <label>
        速度
        <input id="speed" type="range" min="2" max="14" step="0.5" value="7" />
        <span id="speedText">7s/张</span>
      </label>
      <label><input id="reverse" type="checkbox" /> 反向</label>
    </div>

    <script>
      const marquee = document.getElementById('marquee')
      const track = marquee.querySelector('.marquee__track')

      // 让 --n 始终等于“一份列表”的真实张数，加减卡片不用手改 CSS
      const count = track.querySelectorAll('.card').length / 2
      marquee.style.setProperty('--n', count)

      const speed = document.getElementById('speed')
      const speedText = document.getElementById('speedText')
      speed.addEventListener('input', () => {
        document.documentElement.style.setProperty('--sec-per-card', speed.value + 's')
        speedText.textContent = speed.value + 's/张'
      })

      document.getElementById('reverse').addEventListener('change', (e) => {
        marquee.classList.toggle('marquee--reverse', e.target.checked)
      })
    </script>
  </body>
</html>
