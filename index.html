<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孤独市集</title>
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('jh-theme') } catch (e) {}
        var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('to-dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
